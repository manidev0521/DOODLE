<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="AssignmentStyle.css">
    
</head>
<style>
    .show{
        color:aquamarine
    }
    .hide{
        color:brown
    }
</style>
<body>
    <button id="show">show</button>
    <label id="showlabel"></label>
    <script >
        var boolean;
        const button = document.getElementById('show');
        const label = document.getElementById('showlabel');
        button.addEventListener('click', function() {
            boolean = !boolean;
            label.textContent = `${boolean ? "label is visible" :"label is not visible" }`;
            label.className=  `${boolean ? "show":'hide'}`;
        });
    
    </script>

</body>
</html>
